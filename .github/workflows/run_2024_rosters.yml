
name: Collect 2024 MLB Rosters

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect MLB rosters
        run: |
          python build_2024_rosters.py --start 2024-04-01 --end 2024-09-30

      - name: Save roster dataset
        uses: actions/upload-artifact@v4
        with:
          name: mlb-rosters-2024-test
          path: mlb-connections-2024.json

      - name: Publish roster dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlb-connections-2024.json
          git commit -m "Publish 2024 MLB roster data" || exit 0
          git push
